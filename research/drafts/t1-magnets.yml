  narrative:
    significance: It is the first private NdFeB project to win central funding, using a process developed by the
      Ministry of Mines' NFTDC.
    what_it_does: Plans to make neodymium metal by molten-salt electrolysis and turn it into sintered NdFeB magnets,
      starting at 500 tonnes a year.
    why_it_matters: If it reaches production it would be among India's first commercial NdFeB magnet lines; its
      December 2025 start target has passed without a confirmed launch.
