  narrative:
    significance: The oxide-to-metal step is the missing link between IREL's oxides and any Indian magnet factory,
      and this is where the government is demonstrating it.
    what_it_does: Runs pilot plants built on BARC laboratory processes that turn rare earth oxides into metals and
      recover rare earths from scrapped magnets.
    why_it_matters: The park is meant to train entrepreneurs and transfer technology so that private firms can build
      metal plants at industrial scale.
