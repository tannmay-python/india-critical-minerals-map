  - date: '2002-03-25'
    event: ISA exploration contract for polymetallic nodules signed
    source_id: isa-pr-2024-01-18
  narrative:
    what_it_does: 'India''s oldest deep-sea mineral holding: a 75,000 sq km nodule exploration contract with the International
      Seabed Authority in the Central Indian Ocean Basin.'
    significance: The contract runs to 24 March 2027 after extensions in 2017 and 2022; the plan of work targets recovery
      of copper, nickel, cobalt and manganese from nodules.
  confidence: high
  notes: Location is the centre of the bounding box within which the contract area lies (ISA public information sheet); the
    75,000 sq km of blocks is smaller than the box. Expiry date (2027-03-24) kept in status_detail because future milestone
    dates are not allowed.
