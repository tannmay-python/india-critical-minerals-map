updates:
  - id: hcl-kendadih-mine
    set:
      status: Operational
      status_as_of: "2026-01-16"
      status_detail: Underground mining restarted 15 Jan 2026 under a 20-year lease signed 4 Oct 2025
      dates: {first_public: "1957-05-02", commissioned: "1957-05-02", reopened: "2026-01-15",
              original_expected_completion: "2024", revised_expected_completion: "2025-10"}
      narrative: {what_it_does: "A Singhbhum underground copper mine, opened in 1957, that HCL has restarted twice since closing it in 2000."}
    milestones:
      - {date: "1957-05-02", event: "Mine first opened (IBM record)", source_id: ibm-kendadih-draft}
      - {date: "2000-02", event: "Closed for economic reasons", source_id: bs-kendadih-2017}
      - {date: "2017-12-11", event: "Reopened after clearances and a lease deed", source_id: bs-kendadih-2017}
      - {date: "2024-09-20", event: "Jharkhand cabinet approves lease extension", source_id: hcl-surda-pr-2024}
      - {date: "2024-10-05", event: "HCL says reopening is \"on the cards this year\"", source_id: hcl-surda-pr-2024}
      - {date: "2025-09-18", event: "HCL tells investors production will start within 15-20 days of the lease", source_id: hcl-investor-meet-2025}
      - {date: "2025-10-04", event: "20-year mining lease deed signed", source_id: hcl-kendadih-lease-2025}
      - {date: "2026-01-15", event: "Underground mining restarts", source_id: hcl-kendadih-restart-2026}
    sources:
      - ref: ibm-kendadih-draft
        supports: [dates.first_public, dates.commissioned, milestones]
        ev: {dates.commissioned: "(g) First opening date : 02/05/1957"}
      - ref: bs-kendadih-2017
        supports: [milestones]
        ev: {milestones: ["Kendadih copper mine was closed in the February, 2000 due to economic reasons.", "it has re-opened the mine on 11th December, 2017"]}
      - ref: hcl-surda-pr-2024
        supports: [milestones, dates.original_expected_completion]
        ev:
          milestones: "Jharkhand Cabinet has approved lease extension for the Kendadih and Rakha on 20.09.2024."
          dates.original_expected_completion: "Reopening of Kendadih and Rakha mines is on the cards this year"
      - ref: hcl-investor-meet-2025
        supports: [milestones, dates.revised_expected_completion]
        ev: {dates.revised_expected_completion: "And within 15-20 days, we should start the production and all mining operations in Kendadih also."}
      - ref: hcl-kendadih-lease-2025
        supports: [milestones]
        ev: {milestones: "04.10.2025 for a period of 20 years."}
      - ref: hcl-kendadih-restart-2026
        supports: [status, status_as_of, status_detail, dates.reopened, milestones]
        ev: {dates.reopened: "underground mining operations at Kendadih Copper Mine, Ghatshila, Jharkhand (a unit of Hindustan Copper Ltd) has successfully commenced on 15.01.2026."}

  - id: hcl-rakha-mine
    set:
      status: Approved
      status_as_of: "2025-09-19"
      status_detail: Idle since July 2001; reopening by mine developer-operator South West Mining under a 20-year lease signed 19 Sep 2025
      dates: {first_public: "1972", commissioned: "1972", original_expected_completion: "2024", revised_expected_completion: "2027"}
      investment: {amount: 2700, currency: INR_crore, basis: "MDO capex estimate: Rakha reopening, new Chapri mine and concentrator"}
      narrative: {what_it_does: "A Singhbhum copper mine idle since 2001, being reopened and expanded by a mine developer-operator."}
    milestones:
      - {date: "1971-08-29", event: "Mining lease granted", source_id: ibm-rakha-2024}
      - {date: "1972", event: "Mine opened", source_id: ibm-rakha-2024}
      - {date: "2001-07", event: "Mining suspended as unviable", source_id: ibm-rakha-2024}
      - {date: "2024-09-20", event: "Jharkhand cabinet approves lease extension", source_id: hcl-surda-pr-2024}
      - {date: "2024-10-05", event: "HCL says reopening is \"on the cards this year\"", source_id: hcl-surda-pr-2024}
      - {date: "2024-11-25", event: "Letter of award to South West Mining as mine developer-operator", source_id: hcl-rakha-mdo-2025}
      - {date: "2025-01-09", event: "Mining services agreement signed with South West Mining (about Rs 2,700 crore capex)", source_id: hcl-rakha-mdo-2025}
      - {date: "2025-09-18", event: "HCL targets first production 16-18 months after the lease", source_id: hcl-investor-meet-2025}
      - {date: "2025-09-19", event: "20-year mining lease deed signed", source_id: bs-rakha-lease-2025}
    sources:
      - ref: ibm-rakha-2024
        supports: [dates.first_public, dates.commissioned, milestones, status_detail]
        ev:
          dates.commissioned: "16 Date of Opening of Mine 1972"
          milestones: ["14 Date of Grant of Mining Lease 29.08.1971", "not appointed as the mine is non-operation w.e.f July-"]
      - ref: hcl-surda-pr-2024
        supports: [milestones, dates.original_expected_completion]
        ev:
          milestones: "Jharkhand Cabinet has approved lease extension for the Kendadih and Rakha on 20.09.2024."
          dates.original_expected_completion: "Reopening of Kendadih and Rakha mines is on the cards this year"
      - ref: hcl-rakha-mdo-2025
        supports: [milestones, status, status_detail, investment]
        ev:
          milestones: ["The Letter of Award (LoA) was issued to M/s South West Mining Limited (SWML) on 25.11.2024.", "The Mining Services Agreement was signed on 9th January, 2025 between HCL and SWML at Ranchi."]
          status_detail: "The mining operation in Rakha Mine was suspended since 2001 on account of unviable operations."
          investment: "The total capital expenditure (CAPEX) for this project is estimated to be approximately INR 2,700 crore."
      - ref: hcl-investor-meet-2025
        supports: [milestones, status, dates.revised_expected_completion]
        ev:
          status: "Rakha, we got the forest and environment clearance."
          dates.revised_expected_completion: "So, we are targeting 16 to 18 months from the lease date"
      - ref: bs-rakha-lease-2025
        supports: [milestones, status, status_as_of, status_detail]
        ev: {milestones: "Rakha mining lease deed has been executed between the company and District Commissioner (DC), Jamshedpur on September 19, 2025 for an extended period of 20 years."}

  - id: hcl-surda-mine
    set:
      dates: {first_public: "1956", commissioned: "1956", reopened: "2024-10-05"}
    milestones:
      - {date: "1939-06-16", event: "Mining lease first granted", source_id: ibm-surda-2024}
      - {date: "1956", event: "Mine first opened (IBM record)", source_id: ibm-surda-2020}
      - {date: "2003-06-07", event: "Closure notice issued; mining ended and staff offered voluntary retirement", source_id: bs-surda-closure-2003}
      - {date: "2022-06", event: "Operations resume after lease renewal and environment clearance", source_id: iifl-surda-2022}
      - {date: "2023", event: "Production and development stop in 2023-24: lease deed not executed (IBM)", source_id: ibm-surda-2024}
      - {date: "2024-08-29", event: "Jharkhand cabinet approves lease extension", source_id: hcl-surda-pr-2024}
      - {date: "2024-09-26", event: "Lease deed signed", source_id: hcl-surda-pr-2024}
      - {date: "2024-10-05", event: "Operations resume; HCL plans 0.4 to 0.9 million tpy within seven years", source_id: hcl-surda-pr-2024}
    sources:
      - ref: ibm-surda-2020
        supports: [dates.first_public, dates.commissioned, milestones]
        ev: {dates.commissioned: "(g) First opening date : 01/01/1956"}
      - ref: ibm-surda-2024
        supports: [milestones]
        ev: {milestones: ["14 Date of Grant of Mining Lease 16.06.1939", "Due to the non-execution of the mining lease, mine production,", "development activities has stopped in 2023-24"]}
      - ref: bs-surda-closure-2003
        supports: [milestones]
        ev: {milestones: "the closure notice was issued by the Union labour ministry on June 7 and was made public on June 10 at the Surda mines notice board."}
      - ref: iifl-surda-2022
        supports: [milestones]
        ev: {milestones: "The operations have been resumed post renewal of lease by the Government of Jharkhand and after obtaining the required environment clearance (EC)"}
      - ref: hcl-surda-pr-2024
        supports: [milestones, dates.reopened]
        ev:
          dates.reopened: ["Ghatsila, Dt. 05.10.2024", "inaugurated the resumption of Surda Mine operations today in the presence of"]
          milestones: ["Lease was approved by Cabinet of Jharkhand Government on 29.08.2024 and the", "lease deed was executed on 26.09.2024.", "enhance the mining capacity of Surda mine from the current level of 0.4 mtpa to 0,9"]

