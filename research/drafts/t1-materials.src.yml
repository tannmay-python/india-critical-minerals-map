updates:
  - id: himadri-lfp-cam-odisha
    milestones:
      - {date: "2023-12-06", event: "Announced: phase 1 of 40,000 tpa (Rs 1,125 crore) to run within 27-36 months", source_id: acp-himadri-lfp-2023}
      - {date: "2024-09-19", event: "Construction to start Jan 2025; plant due in H2 FY27", source_id: tmm-himadri-lfp-2024}
    sources:
      - ref: acp-himadri-lfp-2023
        supports: [milestones, dates.original_expected_completion]
        ev: {dates.original_expected_completion: "at an estimated cost of Rs 1,125 crore, and will be operational in 27- 36 months at Odisha."}
      - ref: tmm-himadri-lfp-2024
        supports: [milestones]
        ev: {milestones: ["will start in January next year.", "We aim to have the plant operational by the second half of FY27"]}

  - id: gfcl-ev-jolva
    milestones:
      - {date: "2024-02-07", event: "LFP line promised for Q3 2024", source_id: ei-gfcl-2024}
    sources:
      - ref: ei-gfcl-2024
        supports: [milestones]
        ev: {milestones: "LFP project is anticipated to be operational by Q3 of CY 24"}

  - id: acutaas-jhagadia-additives
    set:
      milestones:
        - {date: "2024-12-12", event: "Rs 177 crore expansion to 4,000 tpy announced, due in H1 FY26", source_id: angel-ami-2024}
        - {date: "2026-07-24", event: "Trial run of new battery chemicals plant completed; commercial supply started", source_id: acutaas-call-2026-07}
    sources:
      - ref: angel-ami-2024
        supports: [milestones]
        ev: {milestones: "The project is expected to be completed in the first half of FY 2025-26."}
