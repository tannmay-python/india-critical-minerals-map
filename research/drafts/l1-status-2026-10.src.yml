updates:
  - id: blk-tg-govindpur
    set:
      status: LoI issued
      status_as_of: "2026-08-31"
      status_detail: "Telangana issued NLC India the LoI for a composite licence on 31 Aug 2026"
      auction: {loi_date: "2026-08-31"}
    milestones:
      - {date: "2026-08-31", event: "Letter of intent for composite licence issued by Telangana", source_id: psuwatch-nlc-tg-loi}
    sources: &nlc_tg
      - ref: psuwatch-nlc-tg-loi
        supports: [status, auction.loi_date]
        ev:
          status: "The company emerged as the Preferred Bidder for the Govindpur Vanadium, Titanium & Aluminous Laterite Block and the Parvathapur Vanadium, Titanium & Aluminous Laterite Block"
          auction.loi_date: "NLCIL received the LoI for grant of the Composite Licence from the Government of Telangana on August 31, covering both the Govindpur and Parvathapur blocks."
      - ref: sahi-nlc-tg-loi
        supports: [status]
        ev:
          status: "NLC India has secured a Letter of Intent from the Telangana Government for composite licences covering the Govindpur and Parvathapur blocks."

  - id: blk-tg-parvathapur
    set:
      status: LoI issued
      status_as_of: "2026-08-31"
      status_detail: "Telangana issued NLC India the LoI for a composite licence on 31 Aug 2026"
      auction: {loi_date: "2026-08-31"}
    milestones:
      - {date: "2026-08-31", event: "Letter of intent for composite licence issued by Telangana", source_id: psuwatch-nlc-tg-loi}
    sources: *nlc_tg

  - id: blk-up-nawatola-laband
    set:
      status: Licence / lease executed
      status_as_of: "2026-06-29"
      status_detail: "Composite licence deed executed with Uttar Pradesh on 27 Jun 2026 (LoI notified Jul 2025)"
      auction: {licence_or_lease_executed: "2026-06-27"}
    milestones:
      - {date: "2025-07-04", event: "Letter of intent issued by Uttar Pradesh (company filing)", source_id: hzl-nse-2025-07-04-loi}
      - {date: "2026-06-27", event: "Composite licence deed executed", source_id: scanx-hzl-nawatola-cl}
    sources:
      - ref: hzl-nse-2025-07-04-loi
        supports: [milestones]
        ev:
          milestones: "the Government of Uttar Pradesh has issued Letter of Intent (LoI), under Rule 18(1) of the Mineral Auction Rules 2015, to Hindustan Zinc Limited"
      - ref: bt-hzl-nawatola-cl
        supports: [status]
        ev:
          status: "the Vedanta group firm executed the deed for grant of composite licence (CL)"
      - ref: scanx-hzl-nawatola-cl
        supports: [status, auction.licence_or_lease_executed]
        ev:
          auction.licence_or_lease_executed: "The execution, dated June 27, 2026, was completed with the Government of Uttar Pradesh"

  - id: blk-br-genjana
    set:
      status: LoI issued
      status_as_of: "2025-12-11"
      status_detail: "Vedanta declared successful bidder by letter of 10 Dec 2025 after meeting LoI conditions; licence deed pending"
    milestones:
      - {date: "2025-12-10", event: "Declared successful bidder", source_id: vedl-bse-2025-12-11-genjana}
    sources:
      - ref: vedl-bse-2025-12-11-genjana
        supports: [status, status_detail]
        ev:
          status: "Company has been declared as Successful Bidder in respect of Genjana Nickel, Chromium and PGE Block"
          status_detail: "after fulfilling required statuary compliances via letter dated December 10, 2025"

  - id: blk-ka-devadurga
    set:
      status: Licence / lease executed
      status_as_of: "2026-08-15"
      status_detail: "Exploration agreement with Karnataka signed Aug 2026; SCCL has five years to complete exploration"
      auction: {licence_or_lease_executed: "2026-08-06"}
    milestones:
      - {date: "2026-08-06", event: "Exploration licence agreement signed with the Karnataka Department of Mines and Geology", source_id: uni-sccl-devadurga}
    sources:
      - ref: uni-sccl-devadurga
        supports: [status, auction.licence_or_lease_executed, status_detail]
        ev:
          status: "has formally commenced exploration of gold and copper deposits in Karnataka's Devadurga Block after signing an agreement with the Karnataka Department of Mines and Geology (DMG)."
          status_detail: "Under the agreement, SCCL will complete exploration of the Devadurga Block within five years."
      - ref: tt-sccl-devadurga
        supports: [status]
        ev:
          status: "secured a license to explore for gold and copper in the Devadurga region of Karnataka and would commence exploration activities soon"

  - id: blk-cg-bhalukona-jamnidih
    set:
      status: LoI issued
      status_as_of: "2025-04-28"
      status_detail: "LoI dated 5 Oct 2023; Deccan Gold began exploration work on the composite licence area in Apr 2025"
      auction: {loi_date: "2023-10-05"}
    milestones:
      - {date: "2023-10-05", event: "Letter of intent issued by Chhattisgarh", source_id: dgml-pr-2023-10-27}
      - {date: "2025-04", event: "Exploration work began on the licence area", source_id: filingreader-dgml-2025}
    sources:
      - ref: dgml-pr-2023-10-27
        supports: [status, auction.loi_date]
        ev:
          auction.loi_date: "has received ‘Letter of Intent’ dated October 5, 2023 (received on October 26, 2023) for the Bhalukona — Jamnidih Nickel, Chromium and Associated PGE Block"
      - ref: filingreader-dgml-2025
        supports: [status_detail]
        ev:
          status_detail: "Work commences on Composite Licence over the Bhalukona-Jamnidih Nickel, Chromium and PGE Block in Chhattisgarh"
