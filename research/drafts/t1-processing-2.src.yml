  - id: kmml-sail-titanium-sponge-jv
    set:
      status_detail: "MoU of 4 Apr 2013 (SAIL, KSIDC, KMML) for a 10,000 tpy sponge plant; in Dec 2014 the Steel Ministry said viability awaits cost-effective technology; no later progress found"
      dates: {first_public: "2013-04-04", mou: "2013-04-04"}
    milestones:
      - {date: "2013-04-04", event: "MoU among SAIL, KSIDC and KMML to explore a titanium sponge and metal complex", source_id: ls-usq-4612-2014}
