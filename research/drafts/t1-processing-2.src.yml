      - {date: "2016-05", event: "MoU with BARC on extracting gallium from Bayer liquor", source_id: imyb-2023}
      - {date: "2026-02", event: "Pilot plant still 'being set up' to test feasibility", source_id: alc-nalco-2026}
    sources:
      - ref: imyb-2023
        supports: [dates.first_public, dates.mou, milestones, status_detail]
