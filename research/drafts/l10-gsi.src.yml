    state: null
    season: "2024-25"
    gsi_projects: 195
    nmedt_projects: 62
    sources:
      - ref: ls-usq-1884-2026
        supports: [gsi_projects, nmedt_projects]
        ev:
          gsi_projects: "GSI carried out 195 critical mineral exploration projects in 2024-25, and took up 230 projects in 2025-26 across the country."
          nmedt_projects: "sanctioned 62 projects for critical mineral exploration during 2024–25 and 60 projects during 2025-26"

  - id: gsi-india-2025-26
    scope: national
    state: null
    season: "2025-26"
    gsi_projects: 230
    nmedt_projects: 84
    notes: "NMEDT count rose from 60 (Feb 2026) to 84 (Aug 2026) as projects were sanctioned during the year. GSI's count is also given as 228 initiated (Jul 2025)."
    sources:
      - ref: ls-usq-1884-2026
        supports: [gsi_projects]
        ev:
          gsi_projects: "GSI carried out 195 critical mineral exploration projects in 2024-25, and took up 230 projects in 2025-26 across the country."
      - ref: ls-usq-2978-2026
        supports: [nmedt_projects]
        ev:
          nmedt_projects: "Funding by NMEDT for critical and strategic mineral exploration projects also increased from 62 projects in 2024-25 to 84 projects in 2025-26."
      - ref: ls-usq-476-2025
        supports: [notes]
        ev:
          notes: "the current year 2025-26, 228 exploration projects targeting critical and strategic minerals have been initiated across the country."

  - id: gsi-india-2026-27
