# L10 GSI and NMEDT critical-mineral exploration aggregates (aux, data/gsi_exploration.yml).
# GSI's Field Season Programme documents with state-wise project counts were not found in a fetchable form
# (OPEN_QUESTIONS 17), so rows are national per field season, plus states where a Lok Sabha answer gives figures.
layer: gsi_exploration
aux: true

sources:
  ls-usq-1884-2026:
    raw: sansad.in/AU1884_DDUVqA-74598729
    title: "Lok Sabha Unstarred Question 1884: National Critical Mineral Mission"
    publisher: Lok Sabha Secretariat
    tier: T1
    date: "2026-02-11"
  ls-usq-2978-2026:
    raw: sansad.in/AU2978_4TVdAQ-74598729
    title: "Lok Sabha Unstarred Question 2978: Critical Minerals Reserves"
    publisher: Lok Sabha Secretariat
    tier: T1
    date: "2026-08-05"
  ls-usq-728-2026:
    raw: sansad.in/AU728_i0HlcX-74598729
    title: "Lok Sabha Unstarred Question 728: National Critical Mineral Mission"
    publisher: Lok Sabha Secretariat
    tier: T1
